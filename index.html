<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viaje en Familia · Punta Cana + Orlando 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ocean:#0c5159;--ocean-deep:#073b41;--turq:#1fa9a6;--turq-soft:#7fd0cb;
  --sand:#f7efe2;--sand-2:#fbf6ec;--coral:#e9743b;--coral-soft:#f4a06a;
  --ink:#13302f;--muted:#5f7572;--line:rgba(12,81,89,.14);
  --card:#ffffff;--shadow:0 18px 50px -22px rgba(7,59,65,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Mulish",system-ui,sans-serif;color:var(--ink);background:var(--sand);line-height:1.6;overflow-x:hidden}
h1,h2,h3,.serif{font-family:"Fraunces",Georgia,serif}
em{font-style:italic}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* NAV */
nav{position:sticky;top:0;z-index:50;background:rgba(247,239,226,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 22px;max-width:1080px;margin:0 auto}
nav a{font-size:13px;font-weight:600;text-decoration:none;color:var(--ocean);padding:5px 11px;border-radius:999px;letter-spacing:.2px;transition:.2s}
nav a:hover{background:var(--ocean);color:#fff}

/* HERO */
header.hero{position:relative;background:radial-gradient(120% 90% at 80% -10%,rgba(233,116,59,.30),transparent 55%),radial-gradient(110% 90% at 8% 8%,rgba(31,169,166,.40),transparent 50%),linear-gradient(160deg,var(--ocean) 0%,var(--ocean-deep) 100%);color:#fff;padding:78px 0 92px;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;opacity:.5;pointer-events:none}
.hero .wrap{position:relative;z-index:2}
.eyebrow{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--turq-soft);font-weight:700;margin-bottom:18px}
.hero h1{font-size:clamp(40px,8vw,82px);line-height:.98;font-weight:600;letter-spacing:-.02em;max-width:14ch}
.hero h1 em{color:var(--coral-soft)}
.hero p.lead{max-width:60ch;margin-top:22px;font-size:clamp(16px,2.2vw,19px);color:rgba(255,255,255,.86)}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600}
.route-pill{margin-top:18px;font-size:14px;color:rgba(255,255,255,.75);font-weight:600;letter-spacing:.5px}

/* SECTIONS */
section{padding:74px 0}
.kicker{font-size:12.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--coral);font-weight:700;margin-bottom:12px}
.h2{font-size:clamp(28px,5vw,46px);font-weight:600;letter-spacing:-.015em;line-height:1.05;margin-bottom:8px}
.h2 em{color:var(--turq)}
.sub{color:var(--muted);max-width:62ch;font-size:16.5px;margin-bottom:34px}

/* NÚMEROS */
#numeros{background:var(--sand-2)}
.num-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.num{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;box-shadow:var(--shadow)}
.num .big{font-family:"Fraunces",serif;font-size:40px;font-weight:600;line-height:1;color:var(--ocean)}
.num .lbl{margin-top:8px;font-size:13.5px;color:var(--muted);font-weight:600}
.num .ico{font-size:22px;margin-bottom:6px;display:block}

/* PAREJAS */
.couples{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.couple{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;box-shadow:var(--shadow);overflow:hidden;transition:.25s}
.couple:hover{transform:translateY(-4px)}
.couple::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--turq),var(--coral))}
.couple .n{font-size:12px;font-weight:800;color:var(--coral);letter-spacing:1px}
.couple .names{font-family:"Fraunces",serif;font-size:22px;font-weight:600;margin-top:6px;line-height:1.15}
.heart{color:var(--coral)}

/* OPCIONES / ITINERARIO */
#opciones{background:var(--sand-2)}
.plan-toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:30px;box-shadow:var(--shadow)}
.pt-btn{border:0;background:transparent;font-family:"Mulish";font-weight:700;font-size:14px;color:var(--muted);padding:10px 20px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap}
.pt-btn.active{background:var(--ocean);color:#fff}
.plan-content{display:none}
.plan-content.active{display:block}
.route-tag{font-size:13.5px;font-weight:700;color:var(--ocean);background:rgba(31,169,166,.12);border:1px solid rgba(31,169,166,.25);padding:8px 16px;border-radius:999px;margin-bottom:24px;display:inline-block}
.days{display:flex;flex-direction:column;gap:0}
.day{display:grid;grid-template-columns:96px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.day .when{font-family:"Fraunces",serif}
.day .when .d{font-size:28px;font-weight:600;color:var(--turq);line-height:1}
.day .when .m{font-size:12px;color:var(--muted);font-weight:600;font-family:"Mulish";line-height:1.4;margin-top:4px}
.day .what h3{font-size:18px;font-weight:600;margin-bottom:3px}
.day .what p{font-size:14.5px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:999px;margin-right:5px;margin-bottom:5px}
.c-fly{background:rgba(19,48,47,.10);color:var(--ink)}
.c-beach{background:rgba(31,169,166,.16);color:var(--ocean)}
.c-park{background:rgba(233,116,59,.16);color:var(--coral)}
.c-free{background:rgba(95,117,114,.12);color:var(--muted)}

/* HOTEL */
#hotel{background:linear-gradient(160deg,var(--ocean) 0%,var(--ocean-deep) 100%);color:#fff}
#hotel .kicker{color:var(--coral-soft)}
#hotel .h2 em{color:var(--turq-soft)}
#hotel .sub{color:rgba(255,255,255,.78)}
.hotel-card{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
@media(max-width:640px){.hotel-card{grid-template-columns:1fr}}
.hc-info{display:flex;flex-direction:column;gap:14px}
.hc-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px 20px;font-size:15px}
.hc-badge .label{font-weight:700;color:#fff}
.hc-badge .val{font-size:13px;color:rgba(255,255,255,.75)}
.hc-map{border-radius:18px;overflow:hidden;min-height:280px}
.hc-map iframe{width:100%;height:280px;border:0;display:block}

/* MAPAS */
#mapas{background:var(--sand-2)}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
@media(max-width:640px){.map-grid{grid-template-columns:1fr}}
.map-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.map-card .map-hdr{padding:16px 20px 12px;font-weight:700;font-size:15px;color:var(--ocean)}
.map-card iframe{width:100%;height:260px;border:0;display:block}

/* FOTOS */
#fotos{background:var(--ocean-deep)}
#fotos .kicker{color:var(--coral-soft)}
#fotos .h2{color:#fff}
#fotos .h2 em{color:var(--turq-soft)}
#fotos .sub{color:rgba(255,255,255,.78)}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.foto-card{border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--ocean),var(--turq));min-height:240px;box-shadow:var(--shadow)}
.foto-card img{width:100%;height:240px;object-fit:cover;display:block;transition:.4s}
.foto-card:hover img{transform:scale(1.04)}
.foto-label{position:absolute;bottom:0;left:0;right:0;padding:14px 18px;background:linear-gradient(transparent,rgba(7,59,65,.85));color:#fff;font-size:14px;font-weight:700}

/* PRESUPUESTO */
#presupuesto{background:var(--sand-2)}
.toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:26px;box-shadow:var(--shadow)}
.toggle button{border:0;background:transparent;font-family:"Mulish";font-weight:700;font-size:14px;color:var(--muted);padding:9px 18px;border-radius:999px;cursor:pointer;transition:.2s}
.toggle button.active{background:var(--ocean);color:#fff}
.budget-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
tbody tr{border-bottom:1px solid var(--line)}
td{padding:14px 22px;font-size:15px}
td.cat{font-weight:600;display:flex;align-items:center;gap:10px}
td.cat .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--sand)}
td.amt{text-align:right;font-family:"Fraunces",serif;font-weight:600;font-size:17px;color:var(--ocean);white-space:nowrap}
tr.total{background:var(--ocean)}
tr.total td{color:#fff;font-size:17px;padding:18px 22px}
tr.total td.cat{font-family:"Fraunces",serif;font-weight:700;font-size:20px}
tr.total td.amt{font-size:24px;color:#fff}
tr.sprinter{background:rgba(233,116,59,.06)}
tr.sprinter td.amt{color:var(--coral)}
.budget-foot{display:flex;flex-wrap:wrap;gap:14px;margin-top:20px}
.bf{flex:1;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.bf .k{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.bf .v{font-family:"Fraunces",serif;font-size:28px;font-weight:600;color:var(--coral);margin-top:4px}
.note{font-size:13px;color:var(--muted);margin-top:16px;font-style:italic}

/* FOOTER */
footer{background:var(--ocean-deep);color:rgba(255,255,255,.85);text-align:center;padding:60px 22px}
footer .fh{font-family:"Fraunces",serif;font-size:clamp(22px,4vw,34px);font-weight:600;color:#fff;max-width:22ch;margin:0 auto 14px}
footer .fs{font-size:14px;color:var(--turq-soft);letter-spacing:1px}
footer .meta{font-size:12px;color:rgba(255,255,255,.4);margin-top:22px}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(max-width:560px){.day{grid-template-columns;74px 1fr;gap:12px}.plan-toggle{flex-wrap:wrap;border-radius:18px}}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a href="#numeros">Números</a>
    <a href="#viajan">Quiénes</a>
    <a href="#opciones">Plan</a>
    <a href="#hotel">Hotel</a>
    <a href="#mapas">Mapas</a>
    <a href="#fotos">Fotos</a>
    <a href="#presupuesto">Presupuesto</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow reveal">Viaje en familia · 2026</div>
    <h1 class="reveal">Punta Cana, <em>Disney</em><br>&amp; Orlando</h1>
    <p class="lead reveal">Playa caribeña en el Bahía Príncipe primero, parques después.</p>
</div>
</header>
